name: Roblox 트렌드 트래커

on:
  schedule:
    # 3시간마다 측정 (한국 시간 0:17, 3:17, 6:17, 9:17, 12:17, 15:17, 18:17, 21:17)
    # 리포트는 REPORT_HOUR(기본 9시) 이후 첫 측정 때 하루 한 번만 보내요.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "리포트 전송 (now: 지금 바로 / auto: 오전 9시 이후 하루 한 번)"
        type: choice
        options: [now, auto]
        default: now
  # 외부 예약(cron-job.org 등)은 API로 inputs.report=auto 를 보내서 실행해요.

permissions:
  contents: write         # 기록(data/)을 저장소에 커밋하기 위해 필요

concurrency:
  group: roblox-trend
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 측정 (리포트 시간이면 디스코드 전송)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.report == 'now' && '1' || '0' }}
          # 아래 값들은 원하면 바꿔도 돼요
          REPORT_HOUR: "9"                    # 리포트 받을 시각(한국 시간, 이 시각 이후 첫 측정 때 전송)
          MIN_CCU: "300"                      # 급상승 후보 최소 평균 동접
          NEW_GAME_DAYS: "60"                 # 신작 기준 (출시 후 일수)
          TOP_N: "10"                         # 섹션별 표시 개수
          WATCH_DAYS: "30"                    # 차트에서 빠진 뒤에도 계속 추적하는 일수
          VARIANTS: "all:computer,kr:phone"   # 수집 기준(국가:기기). 첫 번째가 기본 (로블록스가 기기 설정은 순위에 반영하지 않아서 all:phone은 뺐어요)
        run: python trend_tracker.py

      - name: 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "새 기록 없음"
          else
            git commit -q -m "data: $(TZ=Asia/Seoul date '+%F %H:%M') 측정"
            git pull --rebase -q || true
            git push
          fi
